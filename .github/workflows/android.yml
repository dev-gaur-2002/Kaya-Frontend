name: android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      # --wait so the APK exists by the time we try to download it.
      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        run: |
          URL=$(eas build:list --platform android --limit 1 --status finished \
                  --non-interactive --json | node -e \
                  'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].artifacts.buildUrl))')
          curl -fL "$URL" -o kaya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kaya-apk
          path: kaya.apk
